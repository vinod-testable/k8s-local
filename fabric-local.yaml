# Throwaway Postgres + Valkey for local kind testing. Not part of
# ai-testable-platform -- lives in k8s-local/ and is applied directly with
# kubectl. No persistence beyond the pod's lifetime (emptyDir) -- this is
# disposable fixture data, not anything worth keeping.

apiVersion: v1
kind: Pod
metadata:
  name: global-postgres
  namespace: testable-control-plane
  labels:
    app: global-postgres
spec:
  containers:
    - name: postgres
      image: postgres:16-alpine
      env:
        - name: POSTGRES_DB
          value: testable_global
        - name: POSTGRES_USER
          value: svc_control_plane
        - name: POSTGRES_PASSWORD
          value: local-placeholder-pg-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: global-postgres
  namespace: testable-control-plane
spec:
  selector:
    app: global-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: valkey
  namespace: default
  labels:
    app: valkey
spec:
  containers:
    - name: valkey
      image: valkey/valkey:7-alpine
      ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: default
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Pod
metadata:
  name: cell-postgres
  namespace: testable-whitebox-local
  labels:
    app: cell-postgres
spec:
  containers:
    - name: postgres
      image: postgres:16-alpine
      env:
        - name: POSTGRES_DB
          value: cell_local_dev
        - name: POSTGRES_USER
          value: svc_runtime_supply
        - name: POSTGRES_PASSWORD
          value: local-placeholder-cell-pg-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cell-postgres
  namespace: testable-whitebox-local
spec:
  selector:
    app: cell-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Below: rabbitmq/kafka/temporal/minio/oci-registry, added so the whitebox
# cellServices (sharedFabric.kafkaHost="kafka", rabbitmqHost="rabbitmq",
# temporalAddress="temporal:7233" -- all bare hostnames, chart defaults,
# never overridden in values-whitebox.kind.yaml) resolve via in-namespace
# DNS. Namespace must be testable-whitebox-local for that reason.
apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq
  namespace: testable-whitebox-local
  labels:
    app: rabbitmq
spec:
  containers:
    - name: rabbitmq
      image: rabbitmq:3.13-management-alpine
      env:
        - name: RABBITMQ_DEFAULT_USER
          value: testable
        - name: RABBITMQ_DEFAULT_PASS
          value: testable_rmq_dev
      ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: testable-whitebox-local
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: v1
kind: Pod
metadata:
  name: kafka
  namespace: testable-whitebox-local
  labels:
    app: kafka
spec:
  containers:
    - name: kafka
      image: apache/kafka:3.9.0
      env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@localhost:9093"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://:9092,CONTROLLER://:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: CLUSTER_ID
          value: testable-local-kraft-001
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
      ports:
        - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: testable-whitebox-local
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Pod
metadata:
  name: temporal-postgres
  namespace: testable-whitebox-local
  labels:
    app: temporal-postgres
spec:
  containers:
    - name: postgres
      image: postgres:16-alpine
      env:
        - name: POSTGRES_USER
          value: temporal
        - name: POSTGRES_PASSWORD
          value: temporal_dev
        - name: POSTGRES_DB
          value: temporal
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  namespace: testable-whitebox-local
spec:
  selector:
    app: temporal-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# temporal-postgres's init SQL (compose: scripts/temporal-postgres-init/01-init.sql)
# creates the temporal_visibility DB alongside temporal -- auto-setup's own
# entrypoint does this itself via `temporal-sql-tool create-database`, so no
# init script is needed here; auto-setup handles both DBs on first boot.
apiVersion: v1
kind: Pod
metadata:
  name: temporal
  namespace: testable-whitebox-local
  labels:
    app: temporal
spec:
  containers:
    - name: temporal
      image: temporalio/auto-setup:1.27.2
      env:
        - name: DB
          value: postgres12
        - name: DB_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: temporal
        - name: POSTGRES_PWD
          value: temporal_dev
        - name: POSTGRES_SEEDS
          value: temporal-postgres
        - name: DBNAME
          value: temporal
        - name: VISIBILITY_DBNAME
          value: temporal_visibility
        - name: BIND_ON_IP
          value: "0.0.0.0"
      ports:
        - containerPort: 7233
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: testable-whitebox-local
spec:
  selector:
    app: temporal
  ports:
    - port: 7233
      targetPort: 7233
---
apiVersion: v1
kind: Pod
metadata:
  name: minio
  namespace: testable-whitebox-local
  labels:
    app: minio
spec:
  containers:
    - name: minio
      image: minio/minio:latest
      args: ["server", "/data", "--console-address", ":9001"]
      env:
        - name: MINIO_ROOT_USER
          value: testable
        - name: MINIO_ROOT_PASSWORD
          value: testable_minio_dev
      ports:
        - containerPort: 9000
        - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: testable-whitebox-local
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Pod
metadata:
  name: oci-registry
  namespace: testable-whitebox-local
  labels:
    app: oci-registry
spec:
  containers:
    - name: registry
      image: registry:2
      ports:
        - containerPort: 5000
      volumeMounts:
        - name: registry-data
          mountPath: /var/lib/registry
  # Without this, registry:2's default storage lives in the container's own
  # writable layer -- any container restart (kubelet OOM/crash-restart,
  # Docker Desktop restart) wipes every pushed image with no warning, which
  # is what broke runtime-reconciler's imagePullPolicy:Always pull for 19h
  # straight on 2026-09-07. emptyDir survives container restarts (only pod
  # deletion wipes it), matching every other fixture here.
  volumes:
    - name: registry-data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oci-registry
  namespace: testable-whitebox-local
spec:
  selector:
    app: oci-registry
  ports:
    - port: 5000
      targetPort: 5000
